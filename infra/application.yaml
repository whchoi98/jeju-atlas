AWSTemplateFormatVersion: '2010-09-09'
Description: Jeju Atlas - CloudFront, prefix-list restricted public ALB and private Fargate. Reuses existing networking and NAT.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  CloudFrontPrefixListId:
    Type: String
    AllowedPattern: '^pl-[a-f0-9]+$'
  ImageUri:
    Type: String
    Description: Immutable ARM64 ECR image digest URI.
    AllowedPattern: '^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/jeju-3d@sha256:[a-f0-9]{64}$'
  RepositoryArn:
    Type: String
  Release:
    Type: String
    AllowedPattern: '^[a-zA-Z0-9._-]{1,100}$'
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 4
  CatalogBucket:
    Type: String
    Default: ohmyjeju-catalog-061525506239-prod
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
  GuideRuntimeArn:
    Type: String
    Default: arn:aws:bedrock-agentcore:ap-northeast-2:061525506239:runtime/Ohmyjeju_OhmyjejuAgent-7fiRWV5uVi
    AllowedPattern: '^arn:aws:bedrock-agentcore:ap-northeast-2:[0-9]{12}:runtime/[A-Za-z0-9_-]+$'

Resources:
  SessionSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Jeju Atlas session signing key, separate from the ALB origin key.
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true
      Tags:
        - Key: Project
          Value: jeju-3d

  GuideQuota:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: jeju-3d-guide-quota
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: jeju-3d

  OriginSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Random ALB origin verification value used only by this CloudFront distribution.
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true
      Tags:
        - Key: Project
          Value: jeju-3d

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP only from the AWS managed CloudFront origin-facing prefix list.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixListId
          Description: CloudFront origin-facing servers only
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          DestinationSecurityGroupId: !Ref TaskSecurityGroup
          Description: Forward only to Jeju tasks
      Tags:
        - Key: Name
          Value: jeju-3d-alb-cloudfront-only
        - Key: Project
          Value: jeju-3d

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Accept the application port only from the Jeju ALB.
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to ECR and CloudWatch via existing network routes
      Tags:
        - Key: Name
          Value: jeju-3d-private-tasks
        - Key: Project
          Value: jeju-3d

  AlbToTaskIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TaskSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: Jeju ALB requests and health checks

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: jeju-3d-alb
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets: !Ref PublicSubnetIds
      SecurityGroups:
        - !Ref AlbSecurityGroup
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
        - Key: routing.http.desync_mitigation_mode
          Value: strictest
        - Key: idle_timeout.timeout_seconds
          Value: '60'
      Tags:
        - Key: Project
          Value: jeju-3d

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: jeju-3d-tasks
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8080
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /healthz
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
      Tags:
        - Key: Project
          Value: jeju-3d

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            ContentType: text/plain
            StatusCode: '403'
            MessageBody: Forbidden

  OriginRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Jeju-Origin-Verify
            Values:
              - !Sub '{{resolve:secretsmanager:${OriginSecret}:SecretString}}'
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: jeju-3d
      ClusterSettings:
        - Name: containerInsights
          Value: disabled
      Tags:
        - Key: Project
          Value: jeju-3d

  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /ecs/jeju-3d
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: jeju-3d

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*'
      Policies:
        - PolicyName: PullJejuImageAndWriteLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: !Ref RepositoryArn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt LogGroup.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref SessionSecret
      Tags:
        - Key: Project
          Value: jeju-3d

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Read the selected catalog, invoke the selected guide and enforce its daily quota.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*'
      Policies:
        - PolicyName: AtlasCatalogAndGuide
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${CatalogBucket}/catalog/catalog.sqlite'
              - Effect: Allow
                Action:
                  - bedrock-agentcore:InvokeAgentRuntime
                  - bedrock-agentcore:InvokeAgentRuntimeForUser
                Resource:
                  - !Ref GuideRuntimeArn
                  - !Sub '${GuideRuntimeArn}/runtime-endpoint/DEFAULT'
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt GuideQuota.Arn
      Tags:
        - Key: Project
          Value: jeju-3d

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: jeju-3d
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: catalog-cache
      ContainerDefinitions:
        - Name: web
          Image: !Ref ImageUri
          Essential: true
          User: '1000:1000'
          ReadonlyRootFilesystem: true
          LinuxParameters:
            Capabilities:
              Drop:
                - ALL
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - Name: RELEASE
              Value: !Ref Release
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: CATALOG_BUCKET
              Value: !Ref CatalogBucket
            - Name: CATALOG_KEY
              Value: catalog/catalog.sqlite
            - Name: CATALOG_CACHE_DIR
              Value: /tmp/atlas-catalog
            - Name: MEDIA_ORIGIN
              Value: https://ohmyjeju.whchoi.net
            - Name: GUIDE_RUNTIME_ARN
              Value: !Ref GuideRuntimeArn
            - Name: GUIDE_QUOTA_TABLE
              Value: !Ref GuideQuota
            - Name: GUIDE_DAILY_LIMIT
              Value: '30'
            - Name: PUBLIC_ORIGIN
              Value: !Sub 'https://${Distribution.DomainName}'
          Secrets:
            - Name: ATLAS_SESSION_SECRET
              ValueFrom: !Ref SessionSecret
          MountPoints:
            - SourceVolume: catalog-cache
              ContainerPath: /tmp
              ReadOnly: false
          StopTimeout: 30
          HealthCheck:
            Command:
              - CMD
              - node
              - '-e'
              - "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 15
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: web
              mode: non-blocking
              max-buffer-size: 1m
      Tags:
        - Key: Project
          Value: jeju-3d

  Service:
    Type: AWS::ECS::Service
    DependsOn:
      - OriginRule
      - AlbToTaskIngress
    Properties:
      ServiceName: jeju-3d
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DesiredCount: !Ref DesiredCount
      EnableExecuteCommand: false
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups:
            - !Ref TaskSecurityGroup
      LoadBalancers:
        - ContainerName: web
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup
      Tags:
        - Key: Project
          Value: jeju-3d

  CachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: jeju-3d-origin-cache-control
        Comment: Honor HTML revalidation and long-lived fingerprinted assets.
        MinTTL: 0
        DefaultTTL: 60
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  CatalogCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: jeju-3d-catalog-public-cache
        Comment: Public catalog only. Never forward cookies or private guide state.
        MinTTL: 0
        DefaultTTL: 60
        MaxTTL: 300
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: all

  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: jeju-3d-private-api-requests
        Comment: Carry signed sessions and Origin to the uncached API.
        CookiesConfig:
          CookieBehavior: all
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - Origin
            - Content-Type
            - Accept
        QueryStringsConfig:
          QueryStringBehavior: all

  ResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: jeju-3d-security-headers
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Preload: false
            Override: true

  TerrainCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: jeju-3d-terrain-cache
        Comment: Share public DEM tiles across viewers. Seven-day edge default with no user-specific cache keys.
        MinTTL: 0
        DefaultTTL: 604800
        MaxTTL: 2592000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: false
          EnableAcceptEncodingBrotli: false
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  TerrainResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: jeju-3d-terrain-headers
        Comment: Public elevation PNGs; browser caching and resource timing.
        CorsConfig:
          AccessControlAllowCredentials: false
          AccessControlAllowHeaders:
            Items:
              - '*'
          AccessControlAllowMethods:
            Items:
              - GET
              - HEAD
          AccessControlAllowOrigins:
            Items:
              - '*'
          AccessControlMaxAgeSec: 86400
          OriginOverride: true
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
        CustomHeadersConfig:
          Items:
            # This baseline also applies to errors, for which CloudFront skips
            # viewer-response functions. Successful tiles get a longer browser
            # TTL in TerrainBrowserCacheFunction after this policy is applied.
            # Edge cache TTL remains governed by TerrainCachePolicy.
            - Header: Cache-Control
              Value: no-store
              Override: true
            - Header: Timing-Allow-Origin
              Value: '*'
              Override: true

  TerrainBrowserCacheFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: jeju-3d-terrain-browser-cache
      AutoPublish: true
      FunctionConfig:
        Comment: Cache successful DEM responses in browsers; never cache failures.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var response = event.response;
          var status = response.statusCode;
          var success = (status >= 200 && status < 300) || status === 304;
          response.headers['cache-control'] = {
            value: success ? 'public, max-age=86400' : 'no-store'
          };
          return response;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: OriginRule
    Properties:
      DistributionConfig:
        Comment: Jeju Atlas - public 3D terrain explorer
        Enabled: true
        IPV6Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        DefaultRootObject: index.html
        Origins:
          - Id: jeju-alb
            DomainName: !GetAtt LoadBalancer.DNSName
            OriginCustomHeaders:
              - HeaderName: X-Jeju-Origin-Verify
                HeaderValue: !Sub '{{resolve:secretsmanager:${OriginSecret}:SecretString}}'
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 30
              OriginKeepaliveTimeout: 5
              OriginSSLProtocols:
                - TLSv1.2
          - Id: jeju-terrain
            # This existing third-party public dataset is read anonymously.
            # Keep the ALB verification header exclusively on the ALB origin.
            DomainName: elevation-tiles-prod.s3.us-east-1.amazonaws.com
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
              OriginReadTimeout: 30
              OriginKeepaliveTimeout: 5
        CacheBehaviors:
          - PathPattern: /terrarium/*
            TargetOriginId: jeju-terrain
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            Compress: false
            CachePolicyId: !Ref TerrainCachePolicy
            ResponseHeadersPolicyId: !Ref TerrainResponseHeadersPolicy
            FunctionAssociations:
              - EventType: viewer-response
                FunctionARN: !GetAtt TerrainBrowserCacheFunction.FunctionMetadata.FunctionARN
          - PathPattern: /api/catalog/*
            TargetOriginId: jeju-alb
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            CachePolicyId: !Ref CatalogCachePolicy
            ResponseHeadersPolicyId: !Ref ResponseHeadersPolicy
          - PathPattern: /api/*
            TargetOriginId: jeju-alb
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            Compress: false
            # AWS-managed CachingDisabled, verified through ListCachePolicies.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            ResponseHeadersPolicyId: !Ref ResponseHeadersPolicy
        DefaultCacheBehavior:
          TargetOriginId: jeju-alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: !Ref CachePolicy
          ResponseHeadersPolicyId: !Ref ResponseHeadersPolicy
        CustomErrorResponses:
          - ErrorCode: 403
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ErrorCachingMinTTL: 0
          - ErrorCode: 500
            ErrorCachingMinTTL: 0
          - ErrorCode: 502
            ErrorCachingMinTTL: 0
          - ErrorCode: 503
            ErrorCachingMinTTL: 0
          - ErrorCode: 504
            ErrorCachingMinTTL: 0
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: jeju-3d

Outputs:
  ApplicationUrl:
    Value: !Sub 'https://${Distribution.DomainName}'
  DistributionId:
    Value: !Ref Distribution
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  LoadBalancerArn:
    Value: !Ref LoadBalancer
  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  TargetGroupArn:
    Value: !Ref TargetGroup
  AlbSecurityGroupId:
    Value: !Ref AlbSecurityGroup
  TaskSecurityGroupId:
    Value: !Ref TaskSecurityGroup
  LogGroupName:
    Value: !Ref LogGroup
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
  TerrainTileUrl:
    Value: !Sub 'https://${Distribution.DomainName}/terrarium/{z}/{x}/{y}.png'
  TerrainCachePolicyId:
    Value: !Ref TerrainCachePolicy
  CatalogBucketName:
    Value: !Ref CatalogBucket
  GuideQuotaTableName:
    Value: !Ref GuideQuota
