[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "JejuAtlasTools"
version = "0.1.0"
description = "AgentCore MCP Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "astral>=3.2",
    "boto3>=1.35",
    "httpx>=0.27",
    "mcp ~= 1.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
